name: Scheduled Lighthouse Audit

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:

  
permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

  
concurrency:
  group: scheduled-lighthouse-audit
  cancel-in-progress: false

  
jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      
      - name: Warm up Render
        env:
          APP_URL: ${{ vars.CALLBOOKING_PUBLIC_URL }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --max-time 15 \
              --output /dev/null \
              "$APP_URL"; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for Render (attempt $attempt/12)"
            sleep 5
          done

          echo "Application did not become ready"
          exit 1

      
      - name: Run Lighthouse
        env:
          APP_URL: ${{ vars.CALLBOOKING_PUBLIC_URL }}
        run: |
          mkdir -p lighthouse-report

          npx --yes lighthouse@12 "$APP_URL" \
            --chrome-flags="--headless --no-sandbox" \
            --output=json \
            --output=html \
            --output-path=./lighthouse-report/report

      
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7
          if-no-files-found: warn

      
  analyze:
    name: OpenCode Lighthouse Analysis
    needs: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Lighthouse report
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/


      - name: Validate Lighthouse report
        run: |
          test -s lighthouse-report/report.report.json
          python3 -m json.tool lighthouse-report/report.report.json > /dev/null
      
      - name: Run OpenCode Analysis
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/minimax-m2.7
          prompt: |
            Analyze the Lighthouse JSON report at
            lighthouse-report/report.report.json.

            Identify the most important confirmed finding.
            If a confirmed finding exists, create exactly one GitHub issue describing:
            - The measured problem and relevant metrics.
            - Why it matters.
            - A suggested next step.
            - A link to this GitHub Actions run.

            Check existing issues to avoid duplicates.
            If no confirmed finding exists or an equivalent issue is already open, do not create a new issue.
            Do not invent findings.
            Do not modify code, create branches, or open PRs.
            Respond in Russian.
