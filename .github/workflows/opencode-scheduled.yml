name: Scheduled Lighthouse Audit

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:

  
permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

  
concurrency:
  group: scheduled-lighthouse-audit
  cancel-in-progress: false

  
jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      
      - name: Warm up Render
        env:
          APP_URL: ${{ vars.CALLBOOKING_PUBLIC_URL }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --max-time 15 \
              --output /dev/null \
              "$APP_URL"; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for Render (attempt $attempt/12)"
            sleep 5
          done

          echo "Application did not become ready"
          exit 1

      
      - name: Run Lighthouse
        env:
          APP_URL: ${{ vars.CALLBOOKING_PUBLIC_URL }}
        run: |
          mkdir -p lighthouse-report

          npx --yes lighthouse@12 "$APP_URL" \
            --chrome-flags="--headless --no-sandbox" \
            --output=json \
            --output=html \
            --output-path=./lighthouse-report/report

      
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7
          if-no-files-found: warn

      
  analyze:
    name: OpenCode Lighthouse Analysis
    needs: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Lighthouse report
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/


      - name: Validate Lighthouse report
        run: |
          test -s lighthouse-report/report.report.json
          python3 -m json.tool lighthouse-report/report.report.json > /dev/null
      
      - name: Check working tree before OpenCode
        run: |
          echo "Tracked changes:"
          git diff --stat

          echo "Untracked files:"
          git ls-files --others --exclude-standard      
      
      - name: Run OpenCode Analysis
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        with:
          model: opencode/minimax-m2.7
          use_github_token: true
          prompt: |
            You are running unattended in GitHub Actions.

            Task: analyze lighthouse-report/report.report.json
            and create at most one actionable GitHub issue.

            GitHub authentication is already configured.
            Use the gh CLI with GH_TOKEN from the environment.

            Rules:
            - Do not inspect tokens or authentication internals.
            - Do not inspect GitHub Actions implementation files.
            - Do not access paths outside the repository.
            - Do not troubleshoot or reconfigure authentication.
            - Do not modify code, create branches, or open PRs.
            - Do not attempt alternative authentication methods.
            - If a command fails, report the error and stop.
            - Keep the investigation short.

            Steps:
            1. Read the Lighthouse JSON report.
            2. Identify one significant finding with measured evidence.
            3. Check existing open issues using gh issue list.
            4. If no duplicate exists, create one issue using gh issue create.
            5. Include metrics, suggested action, and this run URL:
               https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            If no significant finding exists, create no issue.
            Respond briefly in Russian.

